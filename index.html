<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("project-view-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          }
        } catch (error) {
          theme = "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      html,
      body {
        background: #f0f0f0;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #000000;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Urbanist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Abhishek Kashid, a senior design consultant."
    />
    <title>Abhishek Kashid</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
